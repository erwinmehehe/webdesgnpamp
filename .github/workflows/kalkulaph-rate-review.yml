name: KalkulaPH annual contribution-rate review

on:
  schedule:
    - cron: '15 1 15 12 *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  validate-and-remind:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate KalkulaPH rate manifest
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'kalkulaph/rates.json';
          const m = JSON.parse(fs.readFileSync(p, 'utf8'));
          const fail = (msg) => { console.error(msg); process.exit(1); };
          const num = (v, min, max) => typeof v === 'number' && Number.isFinite(v) && v >= min && v <= max;
          const dateMs = (v) => {
            if (typeof v !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return NaN;
            const [y, mo, d] = v.split('-').map(Number);
            const date = new Date(Date.UTC(y, mo - 1, d));
            if (date.getUTCFullYear() !== y || date.getUTCMonth() !== mo - 1 || date.getUTCDate() !== d) return NaN;
            return date.getTime();
          };
          const near = (a, b, epsilon = .001) => Math.abs(a - b) <= epsilon;

          if (!m.id || typeof m.id !== 'string') fail('Invalid manifest id');
          if (m.version !== undefined && typeof m.version !== 'string') fail('Invalid manifest version');
          const verified = dateMs(m.verifiedOn);
          const effective = dateMs(m.effectiveOn);
          const tomorrow = Date.now() + 86_400_000;
          if (!Number.isFinite(verified) || !Number.isFinite(effective)) fail('Invalid ISO date fields');
          if (verified > tomorrow || effective > tomorrow) fail('Future-dated manifest rejected');
          if (verified < effective) fail('verifiedOn must be on or after effectiveOn');

          const s = m.sss;
          if (!s || !num(s.totalRate,.01,.5) || !num(s.eeRate,0,.5) || !num(s.erRate,0,.5) || !near(s.eeRate + s.erRate, s.totalRate) ||
              !num(s.employeeMscFloor,1,100000) || !num(s.ofwMscFloor,1,100000) || !num(s.kasambahayMscFloor,1,100000) ||
              !num(s.mscCeiling,1000,200000) || !num(s.regularSsCeiling,1000,s.mscCeiling)) fail('Invalid SSS fields');
          if (s.ecLow !== undefined && !num(s.ecLow,0,1000)) fail('Invalid SSS EC low amount');
          if (s.ecHigh !== undefined && !num(s.ecHigh,0,1000)) fail('Invalid SSS EC high amount');
          if (s.ecHighThreshold !== undefined && !num(s.ecHighThreshold,1,200000)) fail('Invalid SSS EC threshold');

          const ph = m.philhealth;
          if (!ph || !num(ph.totalRate,.01,.5) || !num(ph.eeRate,0,.5) || !num(ph.erRate,0,.5) || !near(ph.eeRate + ph.erRate, ph.totalRate) ||
              !num(ph.floor,1,500000) || !num(ph.ceiling,ph.floor,1000000)) fail('Invalid PhilHealth fields');

          const pi = m.pagibig;
          if (!pi || !num(pi.eeRate,0,.2) || !num(pi.eeRateLow,0,.2) || !num(pi.erRate,0,.2) ||
              !num(pi.lowThreshold,1,100000) || !num(pi.maxCompensation,pi.lowThreshold,1000000)) fail('Invalid Pag-IBIG fields');

          console.log(`KalkulaPH rate manifest ${m.id} validated; effective ${m.effectiveOn}; last verified ${m.verifiedOn}.`);
          NODE

      - name: Open yearly official-rate review reminder
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NEXT_YEAR=$((10#$(date -u +%Y) + 1))
          TITLE="KalkulaPH contribution rate review ${NEXT_YEAR}"
          EXISTING=$(gh issue list --state all --search "$TITLE in:title" --json title --jq '.[].title' | grep -Fxc "$TITLE" || true)
          if [ "$EXISTING" -gt 0 ]; then
            echo "Review issue already exists: $TITLE"
            exit 0
          fi
          cat > /tmp/kalkulaph-rate-review.md <<EOF
          Review KalkulaPH's SSS, PhilHealth and Pag-IBIG contribution parameters before the ${NEXT_YEAR} app/rate refresh.

          Checklist:
          - Verify the latest SSS contribution schedule at https://www.sss.gov.ph/pay-contribution/
          - Verify the latest PhilHealth premium schedule at https://www.philhealth.gov.ph/
          - Verify the latest Pag-IBIG mandatory savings contribution guidance at https://www.pagibigfund.gov.ph/
          - Update kalkulaph/rates.json only when an official issuance changes a supported numeric parameter.
          - Update verifiedOn after all three systems have been checked.
          - Do not remotely change BIR tax formulas, labor-law formulas or complex benefit rules; those require an app-reviewed release and regression tests.
          - Run the KalkulaPH app regression suite before publishing any formula changes.

          Current public manifest: https://erwinmehehe.github.io/webdesgnpamp/kalkulaph/rates.json
          EOF
          gh issue create --title "$TITLE" --body-file /tmp/kalkulaph-rate-review.md
